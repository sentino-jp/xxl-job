### web
server.port=${SERVER_PORT:9280}
server.servlet.context-path=/

### web config: actuator、error page、controller-format
management.server.base-path=/actuator
spring.web.error.whitelabel.enabled=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

### mail health
management.health.mail.enabled=false

### resources
spring.mvc.servlet.load-on-startup=0
spring.mvc.static-path-pattern=/static/**
spring.web.resources.static-locations=classpath:/static/

### freemarker
spring.freemarker.templateLoaderPath=classpath:/templates/
spring.freemarker.suffix=.ftl
spring.freemarker.charset=UTF-8
spring.freemarker.request-context-attribute=request
spring.freemarker.settings.number_format=0.##########
spring.freemarker.settings.new_builtin_class_resolver=safer

### mybatis
mybatis.mapper-locations=classpath:/mapper/**/*Mapper.xml

### datasource-pool
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=HikariCP
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=1000

### xxl-job, datasource (values from .env: DB_URL / DB_USER / DB_PASSWORD, same names as coucou-server)
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/xxl_job}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

### xxl-job, email alarm (optional; values from .env MAIL_*)
spring.mail.host=${MAIL_HOST:smtp.example.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.from=${MAIL_FROM:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory

### xxl-job, request executor timeout, by second, default 3s
xxl.job.timeout=3

### xxl-job, i18n (default is zh_CN, and you can choose "zh_CN", "zh_TC" and "en")
xxl.job.i18n=${XXL_JOB_I18N:zh_CN}

## xxl-job, triggerpool max size
xxl.job.triggerpool.fast.max=${XXL_JOB_TRIGGERPOOL_FAST_MAX:300}
xxl.job.triggerpool.slow.max=${XXL_JOB_TRIGGERPOOL_SLOW_MAX:200}

## xxl-job, schedule batch size
xxl.job.schedule.batchsize=100

### xxl-job, lark (feishu) alarm: custom bot webhook. empty webhook-url disables the channel (no-op).
### secret: optional signing secret; env: prefix shown in messages (prod/stage); suppress window: same job alerts at most once per window
xxl.job.alarm.lark.webhook-url=${XXL_JOB_LARK_WEBHOOK_URL:}
xxl.job.alarm.lark.secret=${XXL_JOB_LARK_SECRET:}
xxl.job.alarm.lark.env=${XXL_JOB_LARK_ENV:}
xxl.job.alarm.lark.suppress-window-seconds=${XXL_JOB_LARK_SUPPRESS_SECONDS:300}
### xxl-job, admin public url used to build log links in lark messages, such as "https://xxl-job.example.com"
xxl.job.alarm.lark.admin-url=${XXL_JOB_LARK_ADMIN_URL:}

### xxl-job, log retention days
xxl.job.logretentiondays=${XXL_JOB_LOG_RETENTION_DAYS:30}

### xxl-sso
xxl-sso.token.key=xxl_job_login_token
xxl-sso.token.timeout=604800000
xxl-sso.client.excluded.paths=
xxl-sso.client.login.path=/auth/login

### xxl-job, embedded generic http executor (former xxl-job-executor-http module).
### Each scheduler node registers itself as one instance of the executor group below; jobs with invoke type "HTTP" run here.
xxl.job.executor.enabled=${XXL_JOB_EXECUTOR_ENABLED:true}
### scheduler address list the embedded executor registers to; empty = this process via loopback (http://127.0.0.1:${server.port})
xxl.job.executor.admin-addresses=${XXL_JOB_ADMIN_ADDRESSES:}
### executor group AppName / AccessToken as configured in "执行器管理"
xxl.job.executor.appname=${XXL_JOB_EXECUTOR_APPNAME:http-executor}
xxl.job.executor.accessToken=${XXL_JOB_EXECUTOR_ACCESS_TOKEN:default_token}
### embedded executor server: ip is auto-detected when empty; address (ip:port reachable by the other scheduler nodes) overrides ip:port when set
xxl.job.executor.ip=${XXL_JOB_EXECUTOR_IP:}
xxl.job.executor.port=${XXL_JOB_EXECUTOR_PORT:9999}
xxl.job.executor.address=${XXL_JOB_EXECUTOR_ADDRESS:}
### job log files of the embedded executor
xxl.job.executor.logpath=${XXL_JOB_EXECUTOR_LOGPATH:${LOG_HOME:/data/applogs}/xxl-job/jobhandler}
xxl.job.executor.logretentiondays=${XXL_JOB_LOG_RETENTION_DAYS:30}
### allowed target hosts of httpJobHandler, comma separated. Each entry: host, host:port, .example.com (any sub-domain) or a URL prefix.
### Empty means every host is allowed; production should always set this.
### default = the three company domains (apex + any sub-domain); an explicitly EMPTY env value means "allow every host" — never do that in prod
xxl.job.executor.httpjob.allowdomains=${XXL_JOB_HTTPJOB_ALLOWDOMAINS:.sentino.jp,.coucou.fun,.changeeon.com.cn}
