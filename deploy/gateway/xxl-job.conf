# Internal Gateway (api-gateway/infra) 反代配置：xxl-job 调度中心
# 安装位置：网关机 /etc/nginx/conf.d/xxl-job.conf（源文件放 api-gateway/infra/nginx/conf.d/xxl-job.conf）
# 配套 dnsmasq：在 api-gateway/infra/dnsmasq/dnsmasq.conf 增加一行
#     address=/xxl-job.internal.sentino.jp/127.0.0.1
# 调度中心与 coucou-server 同机部署在三台 OCI 节点上（私网 10.0.0.100 / 10.0.0.194 / 10.0.0.228，端口 9280）。
# 三台实例共用同一个 PostgreSQL，任一实例接收注册 / 回调 / 控制台请求效果相同，不需要会话粘性。

upstream xxl_job_admin {
    # 调度中心节点私网 IP:端口（SERVER_PORT=9280），与 coucou-server 同一批节点
    server 10.0.0.100:9280 max_fails=3 fail_timeout=10s;
    server 10.0.0.194:9280 max_fails=3 fail_timeout=10s;
    server 10.0.0.228:9280 max_fails=3 fail_timeout=10s;

    keepalive 32;
}

server {
    listen 80;
    server_name xxl-job.internal.sentino.jp;

    access_log /var/log/nginx/xxl-job-access.log;
    error_log  /var/log/nginx/xxl-job-error.log warn;

    # 执行器注册 / 回调、OpenAPI、控制台页面都走这里
    location / {
        proxy_pass http://xxl_job_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 执行器心跳默认 3 秒超时，网关侧不要比它更长地缓冲
        proxy_connect_timeout 3s;
        proxy_read_timeout    30s;
        proxy_next_upstream   error timeout http_502 http_503;
    }
}
