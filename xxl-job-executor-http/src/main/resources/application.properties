# no web container; the executor only needs its embedded server for scheduler callbacks
spring.main.web-application-type=none

# log config
logging.config=classpath:logback.xml


### xxl-job admin address list, such as "http://address" or "http://address01,http://address02"
xxl.job.admin.addresses=${XXL_JOB_ADMIN_ADDRESSES:http://127.0.0.1:9280}
### xxl-job timeout by second, default 3s
xxl.job.admin.timeout=3

### xxl-job executor enable, default true
xxl.job.executor.enabled=${XXL_JOB_EXECUTOR_ENABLED:true}
### xxl-job executor appname: the executor group in the scheduler console
xxl.job.executor.appname=${XXL_JOB_EXECUTOR_APPNAME:http-executor}
### xxl-job executor access token: must match the executor group's token in the scheduler console
xxl.job.executor.accessToken=${XXL_JOB_EXECUTOR_ACCESS_TOKEN:default_token}
### xxl-job executor ip: used for register, will get from network if empty
xxl.job.executor.ip=${XXL_JOB_EXECUTOR_IP:}
### xxl-job executor port: used for register, will attempt to generate automatically if empty
xxl.job.executor.port=${XXL_JOB_EXECUTOR_PORT:9999}
### xxl-job executor address: preferred used for register, will use ip:port if empty
xxl.job.executor.address=${XXL_JOB_EXECUTOR_ADDRESS:}
### xxl-job executor log-path
xxl.job.executor.logpath=${XXL_JOB_EXECUTOR_LOGPATH:/data/applogs/xxl-job/jobhandler}
### xxl-job executor log-retention-days
xxl.job.executor.logretentiondays=30

### allowed target hosts of httpJobHandler, comma separated. Each entry: host, host:port, .example.com (any sub-domain) or a URL prefix.
### Empty means every host is allowed; production should always set this.
xxl.job.executor.httpjob.allowdomains=${XXL_JOB_HTTPJOB_ALLOWDOMAINS:}
